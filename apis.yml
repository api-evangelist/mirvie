name: Mirvie
description: >-
  Mirvie is a clinical-stage women's health company founded in 2018 and based in
  South San Francisco, California, pioneering the early prediction of pregnancy
  complications. Its proprietary RNA platform uses a simple maternal blood test
  and machine learning to read tens of thousands of molecular messages from
  mother, baby, and placenta, revealing the underlying biology of each pregnancy
  months before symptoms appear. Mirvie's first product, the Encompass
  preeclampsia test, pairs a novel blood test that predicts personalized
  preeclampsia risk with a preventive care plan and received FDA Breakthrough
  Device designation. The company is backed by General Catalyst, GV, Mayfield,
  Khosla Ventures, Foresite Capital, and Decheng Capital. Mirvie operates
  consumer and clinical web properties (mirvie.com and encompasstest.com) but
  publishes no public developer API; this profile captures its identity and
  domain-security posture for the API Evangelist network.
